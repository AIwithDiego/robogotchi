<!doctype html>
<!-- The README cover and social preview, 1280×640. Render: see docs/src/README.md -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "DM Sans"; font-weight: 100 1000; src: url("../../public/fonts/dm-sans-latin-variable.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 300 700; src: url("../../public/fonts/space-grotesk-latin-variable.woff2") format("woff2"); }
:root { --bg:#172124; --line:#354345; --cream:#e9e8d8; --muted:#9daaa4; --mint:#98ebc8; --amber:#f2b95e; --coral:#f18a70; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 640px; }
body { background: radial-gradient(900px 600px at 25% 30%, #273638, var(--bg)); color: var(--cream); font-family: "DM Sans", system-ui, sans-serif; display: grid; grid-template-columns: 560px 1fr; gap: 40px; padding: 60px 0 60px 64px; overflow: hidden; }
.kicker { color: var(--mint); font: 600 20px "Space Grotesk", sans-serif; letter-spacing: .3px; }
h1 { font: 500 50px/1.08 "Space Grotesk", sans-serif; letter-spacing: -1.5px; margin-top: 18px; }
.num { margin-top: 34px; display: grid; gap: 14px; }
.row { display: flex; align-items: baseline; gap: 16px; }
.row b { font: 600 50px/1 "Space Grotesk", sans-serif; min-width: 40px; text-align: left; }
.row span { font-size: 21px; color: var(--muted); }
.a b { color: var(--mint); } .b b { color: var(--amber); } .c b { color: var(--coral); }
.foot { margin-top: 30px; font-size: 17px; color: var(--muted); }
.shot { align-self: center; border-radius: 16px 0 0 16px; overflow: hidden; border: 1px solid var(--line); border-right: 0; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
.shot img { display: block; width: 900px; }
</style></head>
<body>
  <div>
    <div class="kicker">ROBOGOTCHI · won a Skool community game challenge</div>
    <h1>Raise a robot. Hope it still likes humans.</h1>
    <div class="num">
      <div class="row a"><b>3</b><span>real days to grow up</span></div>
      <div class="row b"><b>3</b><span>lessons decide who it becomes</span></div>
      <div class="row c"><b>0</b><span>servers: the save stays in your browser</span></div>
    </div>
    <p class="foot">Play it in your browser. No account, a 60-second demo.</p>
  </div>
  <div class="shot"><img src="../assets/landing-name-your-robot.png" alt=""></div>
</body></html>
